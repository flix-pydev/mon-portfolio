<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Tresses - Salon de Coiffure Lomé</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fff5f5; color: #4a3737; }
        .header { background: #ffb6c1; text-align: center; padding: 40px 20px; color: white; }
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        .gallery img { width: 100%; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .price-list { background: white; margin: 15px; padding: 20px; border-radius: 8px; }
        .price-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #ffb6c1; padding: 8px 0; }
        .btn-booking { display: block; background: #25D366; color: white; text-align: center; padding: 15px; margin: 20px 15px; border-radius: 30px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Divine Tresses ✨</h1>
        <p>Sublimez votre beauté à Lomé - Quartier Hedzranawoé</p>
    </div>
    <div class="price-list">
        <h3>Nos Tarifs</h3>
        <div class="price-item"><span>Rasta (Box Braids)</span><strong>5 000 F CFA</strong></div>
        <div class="price-item"><span>Nattes Collées</span><strong>3 000 F CFA</strong></div>
        <div class="price-item"><span>Pose Perruque</span><strong>4 000 F CFA</strong></div>
        <div class="price-item"><span>Chignon Mariage</span><strong>15 000 F CFA</strong></div>
    </div>
    <div class="gallery">
        <img src="https://unsplash.com" alt="Modèle 1">
        <img src="https://unsplash.com" alt="Modèle 2">
    </div>
    <a href="https://wa.me" class="btn-booking">📅 Prendre rendez-vous sur WhatsApp</a>
</body>
</html>
